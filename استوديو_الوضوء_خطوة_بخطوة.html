<meta charset="utf-8">
<title>&#x627;&#x644;&#x648;&#x636;&#x648;&#x621; &#x62e;&#x637;&#x648;&#x629; &#x628;&#x62e;&#x637;&#x648;&#x629;</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
  :root{
    --aqua-050:#F2FBFC;
    --aqua-100:#DFF4F7;
    --aqua-200:#BEE9EE;
    --aqua-400:#5FC6D4;
    --aqua-600:#1B9AAC;
    --aqua-800:#10707E;
    --rose-100:#FBE9F2;
    --rose-300:#F3BEDA;
    --rose-500:#E187B4;
    --paper:#FFFFFF;
    --ink:#1F4A52;
    --ink-soft:#4B767E;
    --ring:0 10px 30px rgba(27,154,172,.16);
    --ring-soft:0 4px 14px rgba(27,154,172,.10);
    --r-lg:26px;
    --r-md:18px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:
      radial-gradient(1100px 620px at 88% -8%, var(--aqua-100) 0%, rgba(223,244,247,0) 62%),
      radial-gradient(880px 560px at 4% 108%, var(--rose-100) 0%, rgba(251,233,242,0) 60%),
      var(--aqua-050);
    color:var(--ink);
    font-family:"Tajawal","Noto Sans Arabic","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif;
    min-height:100vh;
  }
  .app{
    direction:rtl;
    max-width:1120px;
    margin:0 auto;
    padding:18px clamp(12px,3vw,28px) 26px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    background:var(--paper);
    border:2px solid var(--aqua-200);
    border-radius:var(--r-md);
    padding:10px 16px;
    box-shadow:var(--ring-soft);
  }
  .brand{
    font-family:"Baloo Bhaijaan 2","Tajawal","Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;
    font-weight:800;
    font-size:clamp(17px,2.4vw,23px);
    color:var(--aqua-800);
    display:flex;align-items:center;gap:10px;
  }
  .brand .drop{width:22px;height:22px;flex:none}
  .topbar-tools{display:flex;align-items:center;gap:8px}
  .counter{
    font-family:"Baloo Bhaijaan 2","Tajawal","Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;
    background:var(--aqua-100);color:var(--aqua-800);
    border-radius:999px;padding:5px 14px;font-size:15px;
    font-variant-numeric:tabular-nums;
  }
  .tool{
    border:2px solid var(--aqua-200);background:var(--paper);color:var(--aqua-800);
    border-radius:12px;width:40px;height:36px;cursor:pointer;font-size:16px;line-height:1;
    display:grid;place-items:center;transition:background .18s,border-color .18s,transform .18s;
  }
  .tool:hover{background:var(--aqua-100);border-color:var(--aqua-400)}
  .tool:active{transform:translateY(1px)}

  /* ---------- stage ---------- */
  .stage{
    background:var(--paper);
    border:2px solid var(--aqua-200);
    border-radius:var(--r-lg);
    box-shadow:var(--ring);
    padding:clamp(16px,3vw,32px);
    min-height:clamp(400px,58vh,560px);
    display:flex;align-items:center;
    position:relative;overflow:hidden;
  }
  .stage::after{
    content:"";position:absolute;inset:auto -40px -70px auto;width:220px;height:220px;
    background:radial-gradient(circle at 50% 50%, var(--rose-100) 0%, rgba(251,233,242,0) 70%);
    pointer-events:none;
  }
  .slide{width:100%;position:relative;z-index:1}
  .anim{animation:rise .38s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ---------- step slide ---------- */
  .step{
    display:grid;
    grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);
    gap:clamp(18px,3vw,36px);
    align-items:center;
  }
  .art{
    background:var(--rose-100);
    border:2px solid var(--rose-300);
    border-radius:22px;
    padding:10px;
    box-shadow:0 8px 22px rgba(225,135,180,.18);
  }
  .art img{display:block;width:100%;height:auto;max-height:52vh;object-fit:contain;border-radius:14px}
  .num{
    display:inline-grid;place-items:center;
    width:64px;height:64px;border-radius:20px;
    background:linear-gradient(160deg,var(--aqua-400),var(--aqua-600));
    color:#fff;font-family:"Baloo Bhaijaan 2","Tajawal","Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;font-weight:800;
    font-size:30px;box-shadow:0 8px 18px rgba(27,154,172,.28);
  }
  .step h2{
    font-family:"Baloo Bhaijaan 2","Tajawal","Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;
    font-weight:800;
    font-size:clamp(30px,5vw,50px);
    line-height:1.18;
    margin:14px 0 0;
    color:var(--aqua-800);
    text-wrap:balance;
  }
  .step p.desc{
    font-size:clamp(17px,2.2vw,22px);
    line-height:1.85;
    color:var(--ink);
    margin:14px 0 0;
    max-width:38ch;
  }
  .times{
    margin-top:18px;
    display:inline-flex;align-items:center;gap:10px;
    background:var(--aqua-100);
    border:2px dashed var(--aqua-400);
    color:var(--aqua-800);
    border-radius:999px;padding:8px 18px;
    font-family:"Baloo Bhaijaan 2","Tajawal","Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;font-size:clamp(17px,2vw,21px);
  }
  .times .big{font-size:1.35em;font-weight:800}
  .tip{
    margin-top:16px;font-size:15px;color:var(--ink-soft);
    display:flex;gap:8px;align-items:flex-start;max-width:36ch;
  }

  /* ---------- intro ---------- */
  .intro{text-align:center;padding:clamp(6px,2vw,18px) 0}
  .intro .kicker{
    display:inline-block;background:var(--rose-100);color:#B4497E;
    border:2px solid var(--rose-300);border-radius:999px;
    padding:6px 18px;font-size:15px;letter-spacing:.02em;
  }
  .intro h1{
    font-family:"Baloo Bhaijaan 2","Tajawal","Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;font-weight:800;
    font-size:clamp(38px,7vw,72px);margin:16px 0 6px;color:var(--aqua-800);
    text-wrap:balance;
  }
  .intro .sub{font-size:clamp(17px,2.3vw,22px);color:var(--ink-soft);margin:0 auto;max-width:44ch;line-height:1.8}
  .intro .thumbs{
    margin-top:26px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;
  }
  .intro .thumbs img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:2px solid var(--rose-300);aspect-ratio:1.6/1}
  .start{
    margin-top:26px;
    font-family:"Baloo Bhaijaan 2","Tajawal","Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;font-size:22px;
    background:linear-gradient(160deg,var(--aqua-400),var(--aqua-600));color:#fff;
    border:none;border-radius:18px;padding:14px 40px;cursor:pointer;
    box-shadow:0 10px 22px rgba(27,154,172,.3);transition:transform .18s,box-shadow .18s;
  }
  .start:hover{transform:translateY(-2px);box-shadow:0 14px 26px rgba(27,154,172,.34)}

  /* ---------- dua ---------- */
  .dua{display:grid;gap:16px;justify-items:center;text-align:center}
  .dua h2{font-family:"Baloo Bhaijaan 2","Tajawal","Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;font-size:clamp(28px,4.6vw,44px);color:var(--aqua-800);margin:0}
  .card{
    background:var(--aqua-050);border:2px solid var(--aqua-200);border-radius:20px;
    padding:18px 24px;max-width:46ch;width:100%;
  }
  .card .label{
    font-size:14px;color:var(--aqua-600);letter-spacing:.04em;margin-bottom:8px;
    font-weight:700;
  }
  .card .text{font-size:clamp(19px,2.6vw,26px);line-height:2;color:var(--ink);font-weight:500}
  .card.rose{background:var(--rose-100);border-color:var(--rose-300)}
  .card.rose .label{color:#B4497E}

  /* ---------- grid ---------- */
  .allsteps h2{font-family:"Baloo Bhaijaan 2","Tajawal","Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;font-size:clamp(26px,4vw,38px);color:var(--aqua-800);margin:0 0 4px;text-align:center}
  .allsteps .lead{text-align:center;color:var(--ink-soft);margin:0 0 18px}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .cell{
    border:2px solid var(--aqua-200);border-radius:16px;background:var(--paper);
    padding:8px;cursor:pointer;text-align:right;transition:border-color .18s,transform .18s,box-shadow .18s;
    font:inherit;color:inherit;
  }
  .cell:hover{border-color:var(--aqua-400);transform:translateY(-3px);box-shadow:var(--ring-soft)}
  .cell img{width:100%;height:auto;border-radius:10px;display:block}
  .cell .cap{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:14px;font-weight:700;color:var(--aqua-800)}
  .cell .cap i{
    font-style:normal;background:var(--aqua-100);border-radius:8px;
    width:22px;height:22px;display:grid;place-items:center;font-size:12px;flex:none;
  }

  /* ---------- controls ---------- */
  .controls{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    background:var(--paper);border:2px solid var(--aqua-200);border-radius:var(--r-md);
    padding:10px 14px;box-shadow:var(--ring-soft);
  }
  .nav{
    font-family:"Baloo Bhaijaan 2","Tajawal","Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;font-size:clamp(16px,2vw,19px);
    border:2px solid var(--aqua-400);background:var(--paper);color:var(--aqua-800);
    border-radius:14px;padding:10px 22px;cursor:pointer;
    display:flex;align-items:center;gap:8px;transition:background .18s,transform .18s;
  }
  .nav:hover:not(:disabled){background:var(--aqua-100)}
  .nav:active:not(:disabled){transform:translateY(1px)}
  .nav:disabled{opacity:.35;cursor:default}
  .nav.primary{background:linear-gradient(160deg,var(--aqua-400),var(--aqua-600));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(27,154,172,.28)}
  .nav.primary:hover:not(:disabled){background:linear-gradient(160deg,var(--aqua-600),var(--aqua-800))}
  .dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;flex:1}
  .dot{
    width:26px;height:26px;border-radius:50%;border:2px solid var(--aqua-200);
    background:var(--paper);color:var(--aqua-600);cursor:pointer;
    font:700 12px/1 "Tajawal","Noto Sans Arabic",Tahoma,sans-serif;display:grid;place-items:center;
    font-variant-numeric:tabular-nums;transition:background .18s,color .18s,transform .18s;padding:0;
  }
  .dot:hover{border-color:var(--aqua-400)}
  .dot.done{background:var(--aqua-100)}
  .dot.on{background:var(--aqua-600);color:#fff;border-color:var(--aqua-600);transform:scale(1.16)}
  .dot.edge{border-color:var(--rose-300);color:#B4497E}
  .dot.edge.on{background:var(--rose-500);border-color:var(--rose-500);color:#fff}
  .bar{height:8px;border-radius:999px;background:var(--aqua-100);overflow:hidden}
  .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--aqua-400),var(--aqua-600));transition:width .35s ease}
  .foot{text-align:center;font-size:13px;color:var(--ink-soft);letter-spacing:.06em}

  button:focus-visible,.cell:focus-visible{outline:3px solid var(--rose-500);outline-offset:3px}

  @media (max-width:860px){
    .step{grid-template-columns:1fr;gap:16px}
    .step .copy{order:2}
    .art{order:1}
    .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .intro .thumbs{grid-template-columns:repeat(4,1fr)}
    .nav{padding:10px 16px}
  }
  @media (max-width:520px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .dots{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>

  {n:12, t:"\u0627\u0631\u062a\u062f\u0627\u0621 \u0627\u0644\u062d\u062c\u0627\u0628",       times:"",  d:"\u0646\u0644\u0628\u0633 \u0627\u0644\u062d\u062c\u0627\u0628 \u0648\u0646\u0633\u062a\u0639\u062f\u0651 \u0644\u0644\u0635\u0644\u0627\u0629 \u0628\u0642\u0644\u0628\u064d \u0645\u0637\u0645\u0626\u0646\u0651.", tip:"\u0648\u0646\u0642\u0648\u0644 \u062f\u0639\u0627\u0621 \u0645\u0627 \u0628\u0639\u062f \u0627\u0644\u0648\u0636\u0648\u0621."}
];

const AR = ["\u0660","\u0661","\u0662","\u0663","\u0664","\u0665","\u0666","\u0667","\u0668","\u0669"];
const ar = n => String(n).split("").map(c => AR[+c] ?? c).join("");

const slides = [{k:"intro"}, ...STEPS.map(s => ({k:"step", s})), {k:"dua"}, {k:"grid"}];
let i = 0;

const el = id => document.getElementById(id);
const slide = el("slide"), dotsBox = el("dots");

function stepHTML(s){
  return `<div class="step">
    <div class="copy">
      <div class="num">${ar(s.n)}</div>
      <h2>${s.t}</h2>
      <p class="desc">${s.d}</p>
      ${s.times ? `<div class="times"><span class="big">${ar(s.times)}\u00d7</span><span>${s.times === "\u0661" ? "\u0645\u0631\u0651\u0629 \u0648\u0627\u062d\u062f\u0629" : "\u062b\u0644\u0627\u062b \u0645\u0631\u0651\u0627\u062a"}</span></div>` : ""}
      <p class="tip">\ud83c\udf38 <span>${s.tip}</span></p>
    </div>
    <div class="art"><img src="${IMG[s.n]}" alt="\u0631\u0633\u0645\u0629 \u0627\u0644\u062e\u0637\u0648\u0629 ${ar(s.n)}: ${s.t}"></div>
  </div>`;
}

function introHTML(){
  const t = [1,3,5,8,10,12].map(n => `<img src="${IMG[n]}" alt="">`).join("");
  return `<div class="intro">
    <span class="kicker">\u0661\u0662 \u062e\u0637\u0648\u0629 \u00b7 \u0644\u0644\u0623\u0637\u0641\u0627\u0644</span>
    <h1>\u0643\u064a\u0641\u064a\u0651\u0629 \u0627\u0644\u0648\u0636\u0648\u0621</h1>
    <p class="sub">\u0646\u062a\u0639\u0644\u0651\u0645 \u0627\u0644\u0648\u0636\u0648\u0621 \u062e\u0637\u0648\u0629 \u0628\u062e\u0637\u0648\u0629: \u0635\u0648\u0631\u0629 \u0648\u0627\u0636\u062d\u0629\u060c \u0648\u0634\u0631\u062d \u0642\u0635\u064a\u0631\u060c \u0648\u0639\u062f\u062f \u0627\u0644\u0645\u0631\u0651\u0627\u062a \u0644\u0643\u0644\u0651 \u062e\u0637\u0648\u0629.</p>
    <div class="thumbs">${t}</div>
    <button class="start" id="startBtn">\u0646\u0628\u062f\u0623 \u25c0</button>
  </div>`;
}

function duaHTML(){
  return `<div class="dua">
    <h2>\u0623\u062f\u0639\u064a\u0629 \u0627\u0644\u0648\u0636\u0648\u0621</h2>
    <div class="card rose">
      <div class="label">\u0642\u0628\u0644 \u0627\u0644\u0648\u0636\u0648\u0621</div>
      <div class="text">\u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u0647\u0650</div>
    </div>
    <div class="card">
      <div class="label">\u0628\u0639\u062f \u0627\u0644\u0648\u0636\u0648\u0621</div>
      <div class="text">\u0623\u064e\u0634\u0652\u0647\u064e\u062f\u064f \u0623\u064e\u0646\u0652 \u0644\u0627 \u0625\u0650\u0644\u0670\u0647\u064e \u0625\u0650\u0644\u0651\u0627 \u0627\u0644\u0644\u0647\u064f \u0648\u064e\u062d\u0652\u062f\u064e\u0647\u064f \u0644\u0627 \u0634\u064e\u0631\u0650\u064a\u0643\u064e \u0644\u064e\u0647\u064f\u060c<br>\u0648\u064e\u0623\u064e\u0634\u0652\u0647\u064e\u062f\u064f \u0623\u064e\u0646\u064e\u0651 \u0645\u064f\u062d\u064e\u0645\u064e\u0651\u062f\u064b\u0627 \u0639\u064e\u0628\u0652\u062f\u064f\u0647\u064f \u0648\u064e\u0631\u064e\u0633\u064f\u0648\u0644\u064f\u0647\u064f</div>
    </div>
    <div class="card">
      <div class="label">\u0648\u0646\u0642\u0648\u0644 \u0623\u064a\u0636\u064b\u0627</div>
      <div class="text">\u0627\u0644\u0644\u0651\u0670\u0647\u064f\u0645\u064e\u0651 \u0627\u062c\u0652\u0639\u064e\u0644\u0652\u0646\u0650\u064a \u0645\u0650\u0646\u064e \u0627\u0644\u062a\u064e\u0651\u0648\u0651\u0627\u0628\u0650\u064a\u0646\u064e<br>\u0648\u064e\u0627\u062c\u0652\u0639\u064e\u0644\u0652\u0646\u0650\u064a \u0645\u0650\u0646\u064e \u0627\u0644\u0652\u0645\u064f\u062a\u064e\u0637\u064e\u0647\u0650\u0651\u0631\u0650\u064a\u0646\u064e</div>
    </div>
  </div>`;
}

function gridHTML(){
  const cells = STEPS.map(s => `<button class="cell" data-go="${s.n}">
      <img src="${IMG[s.n]}" alt="">
      <span class="cap"><i>${ar(s.n)}</i>${s.t}</span>
    </button>`).join("");
  return `<div class="allsteps">
    <h2>\u0643\u0644\u0651 \u0627\u0644\u062e\u0637\u0648\u0627\u062a</h2>
    <p class="lead">\u0627\u0636\u063a\u0637\u064a \u0639\u0644\u0649 \u0623\u064a\u0651 \u062e\u0637\u0648\u0629 \u0644\u0644\u0631\u062c\u0648\u0639 \u0625\u0644\u064a\u0647\u0627.</p>
    <div class="grid">${cells}</div>
  </div>`;
}

function render(){
  const cur = slides[i];
  slide.className = "slide anim";
  slide.innerHTML = cur.k === "intro" ? introHTML()
                  : cur.k === "step"  ? stepHTML(cur.s)
                  : cur.k === "dua"   ? duaHTML()
                  : gridHTML();
  void slide.offsetWidth;

  el("counter").textContent = cur.k === "step" ? `\u0627\u0644\u062e\u0637\u0648\u0629 ${ar(cur.s.n)} \u0645\u0646 ${ar(12)}`
                            : cur.k === "intro" ? "\u0627\u0644\u0645\u0642\u062f\u0651\u0645\u0629"
                            : cur.k === "dua" ? "\u0627\u0644\u0623\u062f\u0639\u064a\u0629" : "\u0643\u0644\u0651 \u0627\u0644\u062e\u0637\u0648\u0627\u062a";
  el("prev").disabled = i === 0;
  el("next").disabled = i === slides.length - 1;
  el("progress").style.width = (i / (slides.length - 1) * 100) + "%";

  [...dotsBox.children].forEach((d, k) => {
    d.classList.toggle("on", k === i);
    d.classList.toggle("done", k < i);
  });

  const st = el("startBtn");
  if (st) st.addEventListener("click", () => go(1));
  slide.querySelectorAll("[data-go]").forEach(b =>
    b.addEventListener("click", () => go(+b.dataset.go)));
}

function go(n){ i = Math.max(0, Math.min(slides.length - 1, n)); render(); }

slides.forEach((s, k) => {
  const b = document.createElement("button");
  b.className = "dot" + (s.k === "step" ? "" : " edge");
  b.textContent = s.k === "step" ? ar(s.s.n) : (s.k === "intro" ? "\u2605" : s.k === "dua" ? "\u2618" : "\u25a6");
  b.title = s.k === "step" ? s.s.t : (s.k === "intro" ? "\u0627\u0644\u0645\u0642\u062f\u0651\u0645\u0629" : s.k === "dua" ? "\u0627\u0644\u0623\u062f\u0639\u064a\u0629" : "\u0643\u0644\u0651 \u0627\u0644\u062e\u0637\u0648\u0627\u062a");
  b.addEventListener("click", () => go(k));
  dotsBox.appendChild(b);
});

el("next").addEventListener("click", () => go(i + 1));
el("prev").addEventListener("click", () => go(i - 1));
el("btnGrid").addEventListener("click", () => go(slides.length - 1));
el("btnFull").addEventListener("click", () => {
  const d = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (d.requestFullscreen) d.requestFullscreen();
});
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(i + 1); }
  if (e.key === "ArrowRight" || e.key === "PageUp") { e.preventDefault(); go(i - 1); }
  if (e.key === "Home") go(0);
  if (e.key === "End") go(slides.length - 1);
});

render();
</script>
